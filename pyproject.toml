[build-system]
requires = ["setuptools>=65.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pysentry-waf"
version = "1.0.0"
description = "Production-Grade Web Application Firewall with ML-based Threat Detection"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "PySentry Team", email = "dangerankur56@gmail.com"}
]
keywords = ["waf", "security", "firewall", "web-security", "threat-detection"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Security",
]

dependencies = [
    "fastapi>=0.104.0",
    "uvicorn[standard]>=0.24.0",
    "pydantic>=2.4.0",
    "python-jose[cryptography]>=3.3.0",
    "passlib[bcrypt]>=1.7.4",
    "python-multipart>=0.0.6",
    "python-dotenv>=1.0.0",
    "pymongo>=4.5.0",
    "motor>=3.3.0",
    "redis>=5.0.0",
    "joblib>=1.3.0",
    "scikit-learn>=1.3.0",
    "python-json-logger>=2.0.7",
    "prometheus-client>=0.19.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "pytest-asyncio>=0.21.0",
    "pytest-mock>=3.12.0",
    "httpx>=0.25.0",
    "black>=23.10.0",
    "flake8>=6.1.0",
    "mypy>=1.6.0",
    "isort>=5.12.0",
    "bandit>=1.7.5",
    "safety>=2.3.5",
]

[project.urls]
Homepage = "https://github.com/r3tr056/pysentry-waf"
Documentation = "https://github.com/r3tr056/pysentry-waf#readme"
Repository = "https://github.com/r3tr056/pysentry-waf"
"Bug Tracker" = "https://github.com/r3tr056/pysentry-waf/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.black]
line-length = 100
target-version = ["py310", "py311", "py312"]
include = '\.pyi?$'

[tool.isort]
profile = "black"
line_length = 100

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
check_untyped_defs = true

[[tool.mypy.overrides]]
module = ["joblib.*", "sklearn.*", "passlib.*", "jose.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
minversion = "7.0"
addopts = "-ra -q --cov=src/pysentry --cov-report=term-missing"
testpaths = ["tests"]
markers = [
    "unit: Unit tests",
    "integration: Integration tests",
    "security: Security tests",
]

[tool.coverage.run]
source = ["src/pysentry"]
omit = ["*/tests/*"]

[tool.coverage.report]
precision = 2
show_missing = true
